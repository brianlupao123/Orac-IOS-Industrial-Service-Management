<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#00488C" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Orac-IOS | Industrial Service Management</title>
    <meta name="description" content="Manage industrial service requests, quotations, purchase orders, field jobs and invoices in one place." />
    <script>
      // Apply the saved theme before first paint so the page never flashes
      // light-then-dark on load or reload. Mirrors ThemeToggle.jsx's own
      // storage key and default; ThemeToggle.jsx remains the only place
      // that ever changes the value.
      (function () {
        try {
          var saved = window.localStorage.getItem("orac-theme");
          var theme = saved === "dark" ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.classList.toggle("dark", theme === "dark");
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

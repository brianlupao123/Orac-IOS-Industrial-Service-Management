services:
  - type: web
    name: orac-industrial-service-portal
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://orac-operations-api.fly.dev/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
